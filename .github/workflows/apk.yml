name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'assets/**'
      - '.github/workflows/apk.yml'
permissions:
  contents: write
concurrency:
  group: apk-build
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: tribridge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Replace tribridge-cyber.apk in the repo (the website serves this file)
        if: github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tribridge-cyber.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tribridge-cyber.apk
          git diff --cached --quiet && exit 0
          git commit -m "Update tribridge-cyber.apk"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
